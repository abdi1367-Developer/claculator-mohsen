<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#fff5f8" />
<title>ماشین حساب عاشقانه فاطمه 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{ box-sizing: border-box; margin: 0; padding: 0; }

  :root{
    --plum:       #4a2c3d;
    --plum-soft:  #8a6b7a;
    --rose:       #e26a8d;
    --rose-deep:  #c94f74;
    --line:       #f6e0e8;
  }

  html, body{
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body{
    font-family: 'Vazirmatn', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
    direction: rtl;
    color: var(--plum);
    background:
      radial-gradient(circle at 10% 0%,  #ffe3ec 0%, transparent 45%),
      radial-gradient(circle at 95% 100%, #ffe8e0 0%, transparent 45%),
      radial-gradient(circle at 85% 8%,  #f4e3ff 0%, transparent 40%),
      linear-gradient(165deg, #fff8fa 0%, #fdf0f4 50%, #fff6f2 100%);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    display: flex;
    justify-content: center;
  }

  /* ============ چیدمان تمام‌صفحه ============ */
  .app{
    width: 100%;
    max-width: 460px;
    height: 100dvh;
    padding: calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 9px;
  }

  /* ============ کارت عاشقانه ============ */
  .love-card{
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-radius: 22px;
    min-height: 84px;
    max-height: 22dvh;
    background: rgba(255,255,255,.75);
    border: 1px solid rgba(226,106,141,.18);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 26px rgba(226,106,141,.12);
  }

  .love-heart{
    flex: 0 0 auto;
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: linear-gradient(135deg,#ffe1ec,#ffd0e0);
    color: var(--rose-deep);
    font-size: 15px;
    box-shadow: inset 0 0 0 1px rgba(226,106,141,.18);
    animation: beat 2.2s ease-in-out infinite;
  }
  @keyframes beat{
    0%,100%{ transform: scale(1); }
    14%    { transform: scale(1.15); }
    28%    { transform: scale(1); }
    42%    { transform: scale(1.1); }
    56%    { transform: scale(1); }
  }

  .love-text{
    font-size: clamp(12.5px, 3.7vw, 15px);
    line-height: 1.9;
    font-weight: 500;
    color: #5c3548;
    text-align: right;
    flex: 1;
    overflow-y: auto;
    max-height: 100%;
    scrollbar-width: none;
    padding-inline-end: 4px;
  }
  .love-text::-webkit-scrollbar{ display: none; }

  .love-text.pop{ animation: lovePop .55s cubic-bezier(.2,.85,.3,1); }
  @keyframes lovePop{
    0%  { opacity: 0; transform: translateY(10px) scale(.97); filter: blur(2px); }
    100%{ opacity: 1; transform: translateY(0)    scale(1);   filter: blur(0);   }
  }

  .float-heart{
    position: absolute;
    bottom: 6px;
    color: #f290b2;
    pointer-events: none;
    opacity: 0;
    animation: floatUp 1.5s ease-out forwards;
  }
  @keyframes floatUp{
    0%  { opacity: 0; transform: translateY(0)     scale(.5); }
    20% { opacity: .95; }
    100%{ opacity: 0; transform: translateY(-70px) scale(1.15); }
  }

  /* ============ ماشین حساب ============ */
  .calc{
    display: flex;
    flex-direction: column;
    padding: 12px;
    border-radius: 26px;
    background: rgba(255,255,255,.88);
    border: 1px solid rgba(255,255,255,.9);
    box-shadow:
      0 20px 44px rgba(190,80,120,.16),
      inset 0 1px 0 rgba(255,255,255,.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    min-height: 0;
  }

  .screen{
    flex: 0 0 auto;
    padding: 12px 16px 10px;
    margin-bottom: 10px;
    border-radius: 20px;
    background: linear-gradient(140deg,#fff2f7 0%,#ffe9f0 55%,#ffeff0 100%);
    border: 1px solid rgba(226,106,141,.13);
    box-shadow: inset 0 2px 10px rgba(226,106,141,.07);
    direction: ltr;
    text-align: right;
    overflow: hidden;
  }

  .history{
    font-size: clamp(10.5px, 3vw, 12.5px);
    color: var(--plum-soft);
    min-height: 17px;
    letter-spacing: .3px;
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    opacity: .85;
  }
  .history::-webkit-scrollbar{ display: none; }

  .result{
    font-size: clamp(26px, 8.5vw, 38px);
    font-weight: 600;
    line-height: 1.35;
    color: #4a2c3d;
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    letter-spacing: .5px;
  }
  .result::-webkit-scrollbar{ display: none; }

  /* ============ کلیدها (عملگرها سمت راست) ============ */
  .keys{
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: clamp(6px, 2vw, 10px);
    min-height: 0;
  }

  .key{
    font-family: inherit;
    font-size: clamp(15px, 4.6vw, 20px);
    font-weight: 500;
    color: var(--plum);
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 18px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 3px 10px rgba(226,106,141,.07);
    transition: transform .11s ease, background .2s ease, box-shadow .2s ease, color .2s ease;
    display: grid;
    place-items: center;
    min-height: 0;
    padding: 0;
  }

  .key:active{ transform: scale(.93); }

  @media (hover: hover){
    .key:hover{ box-shadow: 0 6px 16px rgba(226,106,141,.14); }
    .key.num:hover{ background: #fff8fb; }
    .key.fn:hover{ background: #fce6ef; }
    .key.op:hover{ background: #ffe9f2; }
    .key.eq:hover{ box-shadow: 0 12px 26px rgba(217,79,124,.4); }
  }

  .key.fn{
    background: #fdeef4;
    color: var(--rose-deep);
    font-weight: 600;
    border-color: #f9dbe6;
  }

  /* عملگرها – ستون سمت راست */
  .key.op{
    background: linear-gradient(140deg, #fff2f6 0%, #ffe4ee 100%);
    color: var(--rose-deep);
    font-weight: 700;
    font-size: clamp(19px, 5.6vw, 24px);
    border-color: #fad9e5;
    box-shadow: 0 4px 12px rgba(226,106,141,.14), inset 0 1px 0 #fff;
  }

  .key.eq{
    background: linear-gradient(135deg, #f486ab 0%, #e05c85 55%, #d1497a 100%);
    color: #fff;
    font-weight: 700;
    font-size: clamp(20px, 5.8vw, 25px);
    border: none;
    box-shadow: 0 9px 22px rgba(217,79,124,.34);
  }

  /* نوار پایین – نشان فاطمه */
  .hint{
    flex: 0 0 auto;
    margin-top: 8px;
    text-align: center;
    font-size: 11px;
    color: #b98da0;
    letter-spacing: .2px;
  }

  @media (max-height: 620px){
    .love-card{ min-height: 70px; padding: 9px 13px; border-radius: 18px; }
    .screen{ padding: 9px 14px 8px; margin-bottom: 8px; border-radius: 16px; }
    .result{ font-size: clamp(22px, 7vw, 30px); }
    .calc{ padding: 9px; border-radius: 22px; }
    .key{ border-radius: 14px; }
    .hint{ display: none; }
  }

  @media (max-height: 500px){
    .love-card{ min-height: 58px; }
    .love-text{ font-size: 11.5px; line-height: 1.7; }
    .love-heart{ width: 28px; height: 28px; font-size: 12px; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- 💗 کارت عاشقانه -->
  <div class="love-card" id="loveCard">
    <div class="love-heart">♥</div>
    <p class="love-text" id="loveText">
      فاطمه جانم، سلام… هر محاسبه‌ای که بکنی، جوابش همیشه «دوستت دارم» می‌شه 💗
    </p>
  </div>

  <!-- 🧮 ماشین حساب -->

    <div class="screen">

      <div class="result" id="result">0</div>

      <button class="key op"  data-op="÷">÷</button>

      <button class="key fn"  data-action="clear">C</button>

      <!-- ردیف ۲ -->

      <button class="key num" data-num="4">4</button>

      <!-- ردیف ۴ -->
      <button class="key op"  data-op="+">+</button>
      <button class="key num" data-num="3">3</button>
      <button class="key num" data-num="2">2</button>
      <button class="key num" data-num="1">1</button>

      <!-- ردیف ۵ -->
      <button class="key eq"  data-action="equals">=</button>
      <button class="key num" data-action="dot">.</button>
      <button class="key num" data-num="0">0</button>
      <button class="key fn"  data-action="sign">±</button>
    </div>

    <p class="hint">فاطمه جان، با هر «=» یک جمله عاشقانه برات می‌نویسم 💌</p>
  </div>

</div>

/* =========================================================
   منطق ماشین حساب
   ========================================================= */
const resultEl  = document.getElementById('result');
const historyEl = document.getElementById('history');
const loveEl    = document.getElementById('loveText');
const loveCard  = document.getElementById('loveCard');
const keysEl    = document.getElementById('keys');

const OPS = ['+', '−', '×', '÷'];

let expr = '';
let justEvaluated = false;
let currentLove = loveEl.textContent.trim();

function render(){
  resultEl.textContent = expr === '' ? '0' : expr;
}

function resetIfEvaluated(){
  if (justEvaluated){
    expr = '';
    historyEl.textContent = '';
    justEvaluated = false;
  }
}

function inputDigit(d){
  resetIfEvaluated();
  const parts = expr.split(/[+\-−×÷]/);
  const last  = parts[parts.length - 1];

  if (last === '0' && d === '0') return;
  if (last === '0' && d !== '0'){
    expr = expr.slice(0, -1) + d;
    return render();
  }
  expr += d;
  render();
}

function inputDot(){
  resetIfEvaluated();
  const parts = expr.split(/[+\-−×÷]/);
  const last  = parts[parts.length - 1];
  if (last.includes('.')) return;
  expr += (last === '' ? '0.' : '.');
  render();
}

function inputOp(op){
  if (justEvaluated){ justEvaluated = false; historyEl.textContent = ''; }

  if (expr === ''){
    if (op === '−'){ expr = '−'; render(); }
    return;
  }

  const lastChar = expr.slice(-1);
  if (OPS.includes(lastChar) || lastChar === '.'){
    expr = expr.slice(0, -1) + op;
  } else {
    expr += op;
  }
  render();
}

function backspace(){
  if (justEvaluated){ resetIfEvaluated(); return; }
  expr = expr.slice(0, -1);
  render();
}

function clearAll(){
  expr = '';
  justEvaluated = false;
  historyEl.textContent = '';
  render();
}

function percent(){
  resetIfEvaluated();
  const m = expr.match(/(\d+\.?\d*)$/);
  if (!m) return;
  const value = parseFloat(m[1]) / 100;
  expr = expr.slice(0, m.index) + trimNumber(value);
  render();
}

function toggleSign(){
  resetIfEvaluated();
  const m = expr.match(/(\d+\.?\d*)$/);
  if (!m) return;
  const before = expr.slice(0, m.index);
  if (before.endsWith('−')){
    const before2 = before.slice(0, -1);
    if (before2 === '' || OPS.includes(before2.slice(-1))){
      expr = before2 + m[1];
      return render();
    }
  }
  expr = before + '−' + m[1];
  render();
}

function trimNumber(n){
  const r = Math.round(n * 1e10) / 1e10;
  if (!isFinite(r)) return 'خطا';
  if (r !== 0 && (Math.abs(r) >= 1e15 || Math.abs(r) < 1e-9)){
    return r.toExponential(6);
  }
  return String(r);
}

function evaluate(raw){
  let e = raw.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  e = e.replace(/[+\-*/.]+$/, '');
  if (!e) return null;
  if (!/^[0-9+\-*/.() ]+$/.test(e)) return null;
  try {
    const val = Function('"use strict";return (' + e + ')')();
    if (typeof val !== 'number' || !isFinite(val)) return null;
    return val;
  } catch { return null; }
}

function equals(){
  if (!expr) return;
  const shown = expr;
  const value = evaluate(expr);

  if (value === null){
    historyEl.textContent = shown + ' =';
    resultEl.textContent = 'خطا';
    expr = '';
    justEvaluated = true;
    showLove();
    return;
  }

  historyEl.textContent = shown + ' =';
  expr = trimNumber(value);
  justEvaluated = true;
  render();
  showLove();
}

/* ============ جمله عاشقانه ============ */
function showLove(){
  let next = currentLove;
  let guard = 0;
  while (next === currentLove && guard++ < 40){
    next = LOVE_MESSAGES[Math.floor(Math.random() * LOVE_MESSAGES.length)];
  }
  currentLove = next;

  loveEl.textContent = next;
  loveEl.scrollTop = 0;
  loveEl.classList.remove('pop');
  void loveEl.offsetWidth;
  loveEl.classList.add('pop');

  spawnHearts();
}

function spawnHearts(){
  const count = 4 + Math.floor(Math.random() * 3);
  for (let i = 0; i < count; i++){
    const h = document.createElement('span');
    h.className = 'float-heart';
    h.textContent = '♥';
    h.style.left = (8 + Math.random() * 80) + '%';
    h.style.fontSize = (10 + Math.random() * 11) + 'px';
    h.style.animationDelay = (Math.random() * 0.3) + 's';
    loveCard.appendChild(h);
    setTimeout(() => h.remove(), 1900);
  }
}

/* ============ رویدادها ============ */
keysEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  btn.blur();

  if (btn.dataset.num !== undefined) return inputDigit(btn.dataset.num);
  if (btn.dataset.op  !== undefined) return inputOp(btn.dataset.op);

  switch (btn.dataset.action){
    case 'dot':     return inputDot();
    case 'clear':   return clearAll();
    case 'back':    return backspace();
    case 'percent': return percent();
    case 'sign':    return toggleSign();
    case 'equals':  return equals();
  }
});

document.addEventListener('keydown', (e) => {
  const k = e.key;
  if (/^[0-9]$/.test(k))                     { inputDigit(k); }
  else if (k === '.' || k === ',')           { inputDot(); }
  else if (k === '+')                        { inputOp('+'); }
  else if (k === '-')                        { inputOp('−'); }
  else if (k === '*')                        { inputOp('×'); }
  else if (k === '/')                        { e.preventDefault(); inputOp('÷'); }
  else if (k === 'Enter' || k === '=')       { e.preventDefault(); equals(); }
  else if (k === 'Backspace')                { e.preventDefault(); backspace(); }
  else if (k === 'Escape' || k === 'Delete') { clearAll(); }
  else if (k === '%')                        { percent(); }
});

render();
</script>
